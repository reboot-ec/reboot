server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  mvc:
    throw-exception-if-no-handler-found: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  password-reset:
    expiration-ms: ${PASSWORD_RESET_EXPIRATION_MS:1800000}
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  mail:
    from: ${SMTP_FROM:no-reply@reboot.local}

ad:
  enabled: ${AD_ENABLED:false}
  ldap:
    url: ${AD_LDAP_URL:ldaps://localhost:636}
  base-dn: ${AD_BASE_DN:dc=reboot,dc=com}
  bind-dn: ${AD_BIND_DN:cn=admin,dc=reboot,dc=com}
  bind-password: ${AD_BIND_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
